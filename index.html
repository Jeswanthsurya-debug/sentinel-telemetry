<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Battery Sentinel Diagnostic Console</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: monospace; text-align: center; padding: 40px; }
        .grid { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 25px; width: 220px; }
        .val { font-size: 38px; font-weight: bold; margin-top: 10px; color: #58a6ff; }
        .status-ok { color: #3fb950; }
        .status-warn { color: #f85149; }
    </style>
</head>
<body>
    <h1>BATTERY & THERMAL SENTINEL</h1>
    <p>REAL-TIME MOBILE TELEMETRY MONITOR</p>

    <div class="grid">
        <div class="card">
            <div>BATTERY TEMP</div>
            <div id="temp" class="val">-- °C</div>
        </div>
        <div class="card">
            <div>CHARGE LEVEL</div>
            <div id="level" class="val">-- %</div>
        </div>
        <div class="card">
            <div>HEALTH STATUS</div>
            <div id="status" class="val status-ok">NORMAL</div>
        </div>
    </div>

    <script>
        const ws = new WebSocket('ws://' + window.location.host + '/ui');
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            document.getElementById('temp').innerText = data.temp.toFixed(1) + ' °C';
            document.getElementById('level').innerText = data.level + ' %';
            
            const statusEl = document.getElementById('status');
            statusEl.innerText = data.status;
            if (data.status === 'OVERHEAT') {
                statusEl.className = 'val status-warn';
            } else {
                statusEl.className = 'val status-ok';
            }
        };
    </script>
</body>
</html>
